<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/jmllogo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Add Mission</title>
</head>
<body>
<header th:replace="~{header-and-footer::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <h2>Add Mission</h2>

    <form class="form-panel" method="post" th:action="@{/missions}" th:object="${mission}">

        <div class="form-row">
            <label for="missionCode">Mission code</label>
            <input type="text" id="missionCode" th:field="*{missionCode}" placeholder="M-007" required>
        </div>

        <div class="form-row">
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>

        <div class="form-row">
            <label for="location">Location</label>
            <input type="text" id="location" th:field="*{location}" required>
        </div>

        <div class="form-row">
            <label for="dateStarted">Date started</label>
            <input type="date" id="dateStarted" th:field="*{dateStarted}" required>
        </div>

        <div class="form-row">
            <label for="status">Status</label>
            <select id="status" th:field="*{status}" required>
                <option value="Planning">Planning</option>
                <option value="Active">Active</option>
                <option value="Completed">Completed</option>
            </select>
        </div>

        <div class="form-row">
            <label for="riskLevel">Risk level</label>
            <select id="riskLevel" th:field="*{riskLevel}" required>
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select>
        </div>

        <div class="form-row form-row-wide">
            <label for="description">Description</label>
            <textarea id="description" th:field="*{description}" rows="3" required></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Mission</button>
            <a th:href="@{/missions}" class="btn-secondary">Cancel</a>
        </div>
    </form>

    <p>
        <a th:href="@{/index}">Index</a>
    </p>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
