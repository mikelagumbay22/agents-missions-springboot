<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/jmllogo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Not Found</title>
</head>
<body>
<header th:replace="~{header-and-footer::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <p class="warning">Oops, your data is not found.</p>
    <p class="error" th:text="${message}">Message</p>
    <p>
        <a th:href="@{/index}">Index</a>
    </p>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
