<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Mission List</title>
</head>
<body>
<header th:replace="~{header-and-footer::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <div class="list-header">
        <h2>Mission List</h2>
        <a th:href="@{/missions/new}" class="btn-primary">+ Add Mission</a>
    </div>

    <table class="table table-hover" th:unless="${#lists.isEmpty(missions)}">
        <tr>
            <th>Count</th>
            <th>Code</th>
            <th>Title</th>
            <th>Location</th>
            <th>Status</th>
            <th>Risk</th>
            <th>Link</th>
        </tr>
        <tr th:each="mission, status : ${missions}">
            <td th:text="${status.count}"></td>
            <td th:text="${mission.missionCode}"></td>
            <td th:text="${mission.title}"></td>
            <td th:text="${mission.location}"></td>
            <td>
                <span class="badge-status" th:text="${mission.status}"
                      th:classappend="${mission.status == 'Active' ? 'badge-active' : (mission.status == 'Completed' ? 'badge-completed' : 'badge-planning')}"></span>
            </td>
            <td th:text="${mission.riskLevel}"></td>
            <td><a th:href="@{/missions/{code}(code=${mission.missionCode})}">View</a></td>
        </tr>
    </table>
    <p th:if="${#lists.isEmpty(missions)}" class="error">
        No missions found.
    </p>
    <p>
        <a th:href="@{/index}">Index</a>
    </p>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
