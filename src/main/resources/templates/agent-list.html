<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/jmllogo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Agent List</title>
</head>
<body>
<header th:replace="~{header-and-footer::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <div class="list-header">
        <h2>Agent List</h2>
        <a th:href="@{/agents/new}" class="btn-primary">+ Add Agent</a>
    </div>

    <div class="agent-grid" th:unless="${#lists.isEmpty(agents)}">
        <a class="agent-card" th:each="agent : ${agents}" th:href="@{/agents/{id}(id=${agent.id})}">
            <img class="agent-photo" th:src="${agent.imageUrl}" alt="Agent photo">
            <div class="agent-card-body">
                <h3 th:text="${agent.codename}">Codename</h3>
                <p class="agent-card-name" th:text="${agent.fullName}">Full Name</p>
                <p class="agent-card-meta">
                    <span th:text="${agent.rank}">Rank</span> &middot;
                    <span th:text="${agent.nationality}">Nationality</span>
                </p>
            </div>
        </a>
    </div>

    <p th:if="${#lists.isEmpty(agents)}" class="error">
        No agents found.
    </p>
    <p>
        <a th:href="@{/index}">Index</a>
    </p>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
