<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" th:href="@{/images/jmllogo.png}">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Add Agent</title>
</head>
<body>
<header th:replace="~{header-and-footer::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <h2>Add Agent</h2>

    <form class="form-panel" method="post" th:action="@{/agents}" th:object="${agent}">

        <div class="form-row">
            <label for="codename">Codename</label>
            <input type="text" id="codename" th:field="*{codename}" required>
        </div>

        <div class="form-row">
            <label for="fullName">Full name</label>
            <input type="text" id="fullName" th:field="*{fullName}" required
                   oninput="document.getElementById('imageUrl').value = 'https://ui-avatars.com/api/?name=' +
                   this.value.trim().replace(/ /g, '+') + '&background=1a1a2e&color=fff&size=256'">
        </div>

        <div class="form-row">
            <label for="nationality">Nationality</label>
            <input type="text" id="nationality" th:field="*{nationality}" required>
        </div>

        <div class="form-row">
            <label for="rank">Rank</label>
            <input type="text" id="rank" th:field="*{rank}" required>
        </div>

        <div class="form-row">
            <label for="dateRecruited">Date recruited</label>
            <input type="date" id="dateRecruited" th:field="*{dateRecruited}" required>
        </div>

        <div class="form-row">
            <label for="imageUrl">Photo URL</label>
            <input type="text" id="imageUrl" th:field="*{imageUrl}"
                   placeholder="https://ui-avatars.com/api/?name=Full+Name">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Save Agent</button>
            <a th:href="@{/agents}" class="btn-secondary">Cancel</a>
        </div>
    </form>

    <p>
        <a th:href="@{/index}">Index</a>
    </p>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
