<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Index</title>
</head>
<body>
<header th:replace="~{header-and-footer::header}">
    <h1>Some header text</h1>
</header>
<main class="container">
    <h2>Welcome!</h2>
    <p class="lead">See the list of field agents and their current missions.</p>

    <div class="card-grid">
        <a th:href="@{/agents}" class="index-card">
            <span class="index-card-icon"><i class="bi bi-person-circle"></i></span>
            <span class="index-card-title">Agent List</span>
            <span class="index-card-text">View every agent and the missions they're linked to.</span>
        </a>
        <a th:href="@{/missions}" class="index-card">
            <span class="index-card-icon"><i class="bi bi-globe"></i></span>
            <span class="index-card-title">Mission List</span>
            <span class="index-card-text">View every mission and the agents assigned to it.</span>
        </a>
    </div>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
